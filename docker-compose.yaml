version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:latest
    container_name: whatsapp_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NODE_ENV=production
      # Important: In Docker Compose, the backend connects to MongoDB using the service name 'mongo'
      - MONGO_URI=mongodb://mongo:27017/whatsappdb
      # URL of the frontend (for CORS restrictions). Browsers drop the :80 port.
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongo
    restart: unless-stopped

  # React Vite Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This gets baked into the React frontend during the Docker build process.
        # It needs to be the URL that the browser uses to access the backend API.
        - VITE_API_URL=http://localhost:9000
    container_name: whatsapp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# Persistent volume for the database
volumes:
  mongo_data:
