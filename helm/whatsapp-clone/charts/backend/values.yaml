replicaCount: 1

image:
  repository: ghcr.io/biswajit134/whatsapp-devops/backend
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 9000

# Environment variables injected via ConfigMap
config:
  port: "9000"
  nodeEnv: "production"
  mongoUri: "mongodb://whatsapp-clone-mongodb:27017/whatsappdb"
  frontendUrl: "http://localhost"

# Extra environment variables (e.g., secrets) as raw envFrom sources
extraEnvFrom: []
# - secretRef:
#     name: backend-secret

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.whatsapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    cpu: 500m
#    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Istio Service Mesh
# ---------------------------------------------------------------------------
istio:
  enabled: true

  virtualService:
    # Set to "0s" to disable timeout — required for Socket.io WebSocket connections
    timeout: "0s"
    retries:
      attempts: 3
      perTryTimeout: "5s"
      retryOn: "gateway-error,connect-failure,retriable-4xx"

  destinationRule:
    trafficPolicy:
      tls:
        mode: ISTIO_MUTUAL     # Let Istio manage certificates automatically
      connectionPool:
        tcp:
          maxConnections: 200
        http:
          http1MaxPendingRequests: 200
          http2MaxRequests: 2000
          idleTimeout: "3600s"   # Keep long-lived WebSocket connections alive
      outlierDetection:
        consecutive5xxErrors: 5
        interval: "10s"
        baseEjectionTime: "30s"
        maxEjectionPercent: 50

