{{- if .Values.istio.enabled }}
# Istio IngressGateway — single entry point for external traffic into the mesh.
# Routes external HTTP(S) traffic to the frontend VirtualService.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    istio: ingressgateway   # matches the default Istio ingress gateway pod
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.istio.gateway.host | quote }}
      {{- if .Values.istio.gateway.httpsRedirect }}
      tls:
        httpsRedirect: true
      {{- end }}
    {{- if .Values.istio.gateway.httpsEnabled }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - {{ .Values.istio.gateway.host | quote }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.gateway.tlsSecret | quote }}
    {{- end }}
{{- end }}
